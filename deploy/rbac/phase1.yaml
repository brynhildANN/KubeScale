apiVersion: v1
kind: Namespace
metadata:
  name: kubescale-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubescale-backend
  namespace: kubescale-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubescale-demo-controller
  namespace: autoscale-demo
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubescale-demo-controller
  namespace: autoscale-demo
subjects:
  - kind: ServiceAccount
    name: kubescale-backend
    namespace: kubescale-system
roleRef:
  kind: Role
  name: kubescale-demo-controller
  apiGroup: rbac.authorization.k8s.io
